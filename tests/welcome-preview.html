<!doctype html><html lang="fr"><meta charset="utf-8"><title>Contrôle responsive de l’accueil</title><style>body{margin:0;padding:12px;background:#e6e8e9;font:14px system-ui}header{margin-bottom:12px}iframe{display:block;border:0;background:white;box-shadow:0 4px 20px #0002}button,select{font:inherit;padding:8px}output{margin-left:15px}</style><header><label>Largeur <select id="width"><option>360</option><option selected>390</option><option>430</option><option>768</option><option>1280</option></select></label> <button id="check">Contrôler la largeur</button><output id="result"></output></header><iframe title="Accueil mobile" src="/mobile/" width="390" height="844"></iframe><script>
const frame=document.querySelector('iframe');document.querySelector('#width').onchange=e=>frame.style.width=e.target.value+'px';document.querySelector('#check').onclick=()=>{const d=frame.contentDocument,w=frame.contentWindow;document.querySelector('#result').textContent=JSON.stringify({width:w.innerWidth,scrollWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,brokenImages:[...d.images].filter(i=>!i.complete||!i.naturalWidth).length});};
</script></html>
